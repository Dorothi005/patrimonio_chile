<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sugerencias recibidas</title>

    <link rel="icon" type="image/png" href="img/favicon.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="text-center py-4">
    <h1>Sugerencias recibidas</h1>
    <p class="lead">Mensajes enviados desde Atención al cliente</p>
</header>

<section class="container">

    <div id="resumen" class="row g-2 mb-4"></div>

    <div class="row mb-3">
        <div class="col-md-6">
            <input
                type="text"
                id="buscador"
                class="form-control"
                placeholder="Buscar por nombre, correo o mensaje">
        </div>

        <div class="col-md-3">
            <select id="filtroTipo" class="form-select">
                <option value="todos">Todos</option>
                <option value="sugerencia">Sugerencias</option>
                <option value="consulta">Consultas</option>
                <option value="reclamo">Reclamos</option>
                <option value="felicitacion">Felicitaciones</option>
            </select>
        </div>

        <div class="col-md-3">
            <button id="btnEjemplos" class="btn btn-secondary w-100">
                Cargar ejemplos
            </button>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-bordered">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Nombre</th>
                    <th>Correo</th>
                    <th>Tipo</th>
                    <th>Mensaje</th>
                    <th>Estado</th>
                    <th>Fecha</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla"></tbody>
        </table>
    </div>

</section>

<div class="modal fade" id="modalEditar" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <form id="formEditar">

                <div class="modal-header">
                    <h5 class="modal-title">Editar mensaje</h5>
                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal">
                    </button>
                </div>

                <div class="modal-body">

                    <div class="mb-3">
                        <label for="editar-nombre" class="form-label">
                            Nombre
                        </label>
                        <input type="text"
                               id="editar-nombre"
                               class="form-control">
                    </div>

                    <div class="mb-3">
                        <label for="editar-correo" class="form-label">
                            Correo
                        </label>
                        <input type="email"
                               id="editar-correo"
                               class="form-control">
                    </div>

                    <div class="mb-3">
                        <label for="editar-tipo" class="form-label">
                            Tipo
                        </label>
                        <select id="editar-tipo"
                                class="form-select">
                            <option value="sugerencia">Sugerencia</option>
                            <option value="consulta">Consulta</option>
                            <option value="reclamo">Reclamo</option>
                            <option value="felicitacion">Felicitación</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="editar-mensaje" class="form-label">
                            Mensaje
                        </label>
                        <textarea id="editar-mensaje"
                                  class="form-control"
                                  rows="4"></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="editar-estado" class="form-label">
                            Estado
                        </label>
                        <select id="editar-estado"
                                class="form-select">
                            <option value="nueva">Nueva</option>
                            <option value="revisada">Revisada</option>
                            <option value="aceptada">Aceptada</option>
                        </select>
                    </div>

                </div>

                <div class="modal-footer">
                    <button type="submit"
                            class="btn btn-primary">
                        Guardar cambios
                    </button>
                </div>

            </form>

        </div>
    </div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3">

    <div id="toastAviso" class="toast">

        <div class="toast-body" id="toastTexto"></div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/datos.js"></script>
<script src="js/negocio.js"></script>
<script src="js/vista.js"></script>
<script src="js/sugerencias.js"></script>

</body>
</html>
